version: '3.8'

# Development stack. Values interpolate from .env (see .env.example);
# the :- fallbacks keep a fresh clone bootable with dev-only credentials.

services:
  postgres:
    image: postgres:15-alpine
    container_name: devops-maturity-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops123}
      POSTGRES_DB: ${POSTGRES_DB:-devops_maturity}
    ports:
      - "8682:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-maturity-backend
    ports:
      - "8680:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops123}@postgres:5432/${POSTGRES_DB:-devops_maturity}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: ${DEBUG:-True}
      CREATE_DEV_USERS: ${CREATE_DEV_USERS:-True}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Entrypoint handles: wait for DB, run migrations, init DB (seed user/frameworks)
    # CMD is passed as arguments to the entrypoint
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-maturity-frontend
    ports:
      - "8673:5173"
    environment:
      # Vite dev server proxies /api to this address (see vite.config.ts)
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
