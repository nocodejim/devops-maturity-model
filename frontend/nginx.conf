server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — same-origin for the browser, proxied to the backend
    # container. Keeps CORS out of the picture entirely.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets can cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
